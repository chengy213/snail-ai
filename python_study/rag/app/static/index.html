<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snail RAG · 文档智能问答</title>
<style>
  :root {
    --bg: #f9fafb;
    --surface: #ffffff;
    --primary: #4f46e5;
    --primary-light: #eef2ff;
    --text: #111827;
    --text-secondary: #6b7280;
    --text-muted: #9ca3af;
    --border: #e5e7eb;
    --user-bubble: #4f46e5;
    --radius-sm: 8px;
    --radius: 14px;
    --radius-lg: 20px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
    --shadow: 0 4px 6px -1px rgba(0,0,0,.07), 0 2px 4px -2px rgba(0,0,0,.05);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── header ── */
  .header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  .header-left { display:flex; align-items:center; gap:10px; }
  .logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    border-radius: 8px;
    display: flex; align-items:center; justify-content:center;
    color: #fff; font-size:16px; font-weight:700;
  }
  .header h1 { font-size:16px; font-weight:600; }
  .header-right { display:flex; align-items:center; gap:8px; }
  .status-dot {
    width:7px; height:7px; border-radius:50%; background:#22c55e;
    box-shadow: 0 0 0 3px rgba(34,197,94,.15);
  }
  .status-label { font-size:12px; color:var(--text-muted); }

  /* ── chat area ── */
  .chat-scroll {
    flex:1;
    overflow-y:auto;
    padding: 24px 0 16px;
    scroll-behavior: smooth;
  }
  .chat-inner {
    max-width: 800px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  /* welcome */
  .welcome {
    text-align: center;
    padding: 60px 20px 40px;
  }
  .welcome-icon {
    width: 64px; height: 64px;
    margin: 0 auto 20px;
    background: var(--primary-light);
    border-radius: 20px;
    display: flex; align-items:center; justify-content:center;
    font-size: 32px;
  }
  .welcome h2 { font-size:22px; margin-bottom:8px; }
  .welcome p { color:var(--text-secondary); font-size:14px; line-height:1.6; }

  /* message bubbles */
  .msg-row {
    display: flex;
    gap: 10px;
    padding: 6px 0;
    animation: msgIn .35s ease;
  }
  @keyframes msgIn { from { opacity:0; transform:translateY(10px); } }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.user .avatar { display:none; }

  .avatar {
    flex-shrink: 0;
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items:center; justify-content:center;
    font-size:14px;
    margin-top: 2px;
  }
  .avatar.ai {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #fff;
  }
  .avatar.user {
    background: #1e293b;
    color: #fff;
  }

  .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: var(--radius-lg);
    font-size: 14px;
    line-height: 1.65;
    word-break: break-word;
  }
  .msg-row.ai .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
    box-shadow: var(--shadow-sm);
  }
  .msg-row.user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border-top-right-radius: 4px;
  }

  /* references inside ai bubble */
  .refs {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .ref-tag {
    display: inline-flex; align-items:center; gap:4px;
    padding: 4px 10px;
    background: var(--primary-light);
    border-radius: 20px;
    font-size: 11px;
    color: var(--primary);
    text-decoration: none;
  }
  .ref-tag .score { color: var(--text-muted); }

  /* loading dots */
  .loading-dots { display:flex; gap:4px; padding:4px 0; }
  .loading-dots span {
    width:6px; height:6px; border-radius:50%; background: var(--text-muted);
    animation: dotBounce 1.4s infinite ease-in-out both;
  }
  .loading-dots span:nth-child(1) { animation-delay:-.32s; }
  .loading-dots span:nth-child(2) { animation-delay:-.16s; }
  @keyframes dotBounce { 0%,80%,100% { transform:scale(0); } 40% { transform:scale(1); } }

  /* system msg */
  .sys-msg {
    text-align:center; padding:8px 20px;
    font-size:12px; color:var(--text-muted);
  }

  /* ── input area ── */
  .input-area {
    flex-shrink:0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 20px 16px;
    z-index: 10;
  }
  .input-inner {
    max-width: 800px;
    margin: 0 auto;
  }

  /* file chips above input */
  .attach-preview {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .attach-chip {
    display: inline-flex; align-items:center; gap:6px;
    padding: 5px 10px;
    background: var(--primary-light);
    border-radius: 20px;
    font-size: 12px;
    color: var(--primary);
    animation: chipIn .2s ease;
  }
  @keyframes chipIn { from { transform:scale(.8); opacity:0; } }
  .attach-chip .icon { font-size:14px; }
  .attach-chip .name { max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .attach-chip .remove {
    cursor:pointer; width:16px; height:16px;
    border-radius:50%; background:rgba(0,0,0,.08);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; line-height:1; flex-shrink:0;
    margin-left:2px;
  }
  .attach-chip .remove:hover { background:rgba(0,0,0,.18); }
  .attach-chip.uploading { opacity:.6; }
  .attach-chip.done { background:#dcfce7; color:#166534; }
  .attach-chip.error { background:#fef2f2; color:#991b1b; }

  /* input bar */
  .input-bar {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 10px 8px 16px;
    transition: border-color .2s, box-shadow .2s;
  }
  .input-bar:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79,70,229,.1);
  }
  .input-bar textarea {
    flex: 1;
    border: none;
    background: transparent;
    outline: none;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    line-height: 1.5;
    max-height: 150px;
    min-height: 28px;
    padding: 4px 0;
    color: var(--text);
    align-self: center;
  }
  .input-bar textarea::placeholder { color: var(--text-muted); }

  .btn-attach {
    width: 34px; height: 34px;
    border: none; background: transparent;
    border-radius: 50%;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 20px;
    display: flex; align-items:center; justify-content:center;
    transition: background .15s;
    flex-shrink: 0;
  }
  .btn-attach:hover { background: var(--border); }
  .btn-attach input[type=file] { display:none; }

  .btn-send {
    width: 34px; height: 34px;
    border: none;
    background: var(--primary);
    border-radius: 50%;
    cursor: pointer;
    color: #fff;
    font-size: 16px;
    display: flex; align-items:center; justify-content:center;
    transition: background .15s, opacity .15s;
    flex-shrink: 0;
  }
  .btn-send:hover { background: #4338ca; }
  .btn-send:disabled { opacity:.35; cursor:not-allowed; }

  .input-tools {
    display: flex;
    align-items: center;
    margin-top: 8px;
    padding-left: 4px;
  }
  .file-hint { font-size:11px; color:var(--text-muted); }

  /* toast */
  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    padding: 9px 20px; border-radius: 20px; font-size:13px; font-weight:500;
    z-index: 1000;
    animation: toastIn .3s ease;
  }
  @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(-10px); } }
  .toast.success { background:#166534; color:#fff; }
  .toast.error { background:#991b1b; color:#fff; }

  /* scrollbar */
  .chat-scroll::-webkit-scrollbar { width:5px; }
  .chat-scroll::-webkit-scrollbar-track { background:transparent; }
  .chat-scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:10px; }

  /* responsive */
  @media (max-width:600px) {
    .bubble { max-width:88%; }
    .header h1 { font-size:14px; }
    .chat-inner { padding:0 12px; }
    .input-area { padding:10px 12px 14px; }
  }
</style>
</head>
<body>

<!-- header -->
<div class="header">
  <div class="header-left">
    <div class="logo">S</div>
    <h1>Snail RAG 文档问答</h1>
  </div>
  <div class="header-right">
    <span class="status-dot"></span>
    <span class="status-label">在线</span>
  </div>
</div>

<!-- chat -->
<div class="chat-scroll" id="chatScroll">
  <div class="chat-inner" id="chatInner">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">📄</div>
      <h2>有什么可以帮助你的？</h2>
      <p>上传文档后，我可以基于文档内容回答你的问题。<br>支持 PDF、Markdown、TXT 格式</p>
    </div>
  </div>
</div>

<!-- input -->
<div class="input-area">
  <div class="input-inner">
    <div class="attach-preview" id="attachPreview"></div>
    <div class="input-bar">
      <label class="btn-attach" title="上传附件 (.pdf .txt .md)">
        📎<input type="file" id="fileInput" accept=".pdf,.txt,.md" multiple>
      </label>
      <textarea id="textInput" rows="1" placeholder="输入你的问题…"></textarea>
      <button class="btn-send" id="btnSend" title="发送">↑</button>
    </div>
    <div class="input-tools">
      <span class="file-hint">支持 .pdf .txt .md 格式，可拖拽上传</span>
    </div>
  </div>
</div>

<script>
const $ = (s, p=document) => p.querySelector(s);
const chatScroll = $('#chatScroll');
const chatInner  = $('#chatInner');
const welcome    = $('#welcome');
const textInput  = $('#textInput');
const btnSend    = $('#btnSend');
const fileInput  = $('#fileInput');
const attachPrev = $('#attachPreview');

let pendingFiles = []; // { file, name, status }

// ======== auto-resize textarea ========
textInput.addEventListener('input', () => {
  textInput.style.height = 'auto';
  textInput.style.height = Math.min(textInput.scrollHeight, 150) + 'px';
});

// ======== key bindings ========
textInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

// ======== helpers ========
function scrollBottom() {
  requestAnimationFrame(() => { chatScroll.scrollTop = chatScroll.scrollHeight; });
}
function hideWelcome() { if (welcome) welcome.style.display = 'none'; }

// ======== escape ========
function esc(s) {
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

function fmtAnswer(text) {
  let h = esc(text);
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\n\n/g, '<br><br>');
  h = h.replace(/\n/g, '<br>');
  return h;
}

// ======== messages ========
function addSysMsg(text) {
  hideWelcome();
  const d = document.createElement('div'); d.className='sys-msg'; d.textContent=text;
  chatInner.appendChild(d); scrollBottom();
}

function addUserMsg(text) {
  hideWelcome();
  const row = document.createElement('div'); row.className='msg-row user';
  row.innerHTML = '<div class="avatar user">U</div><div class="bubble">' + esc(text) + '</div>';
  chatInner.appendChild(row); scrollBottom();
}

function addAiMsg(html) {
  const row = document.createElement('div'); row.className='msg-row ai';
  row.innerHTML = '<div class="avatar ai">AI</div><div class="bubble">' + html + '</div>';
  chatInner.appendChild(row); scrollBottom();
  return row;
}

function addLoading() {
  const row = document.createElement('div'); row.className='msg-row ai loading-msg';
  row.innerHTML = '<div class="avatar ai">AI</div><div class="bubble"><div class="loading-dots"><span></span><span></span><span></span></div></div>';
  chatInner.appendChild(row); scrollBottom();
  return row;
}

// ======== toast ========
function toast(msg, type) {
  const t = document.createElement('div'); t.className='toast ' + type; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2800);
}

// ======== file chips ========
function renderChips() {
  attachPrev.innerHTML = pendingFiles.map(function(f, i){
    var cls = '', statusHtml = '';
    if (f.status === 'uploading')   { cls='uploading'; statusHtml='<span style="font-size:10px">…</span>'; }
    else if (f.status === 'done')   { cls='done';       statusHtml='<span style="font-size:10px">✓</span>'; }
    else if (f.status === 'error')  { cls='error';      statusHtml='<span style="font-size:10px">✗</span>'; }
    return '<span class="attach-chip ' + cls + '">' +
      '<span class="icon">📄</span><span class="name">' + esc(f.name) + '</span>' + statusHtml +
      '<span class="remove" data-idx="' + i + '">×</span>' +
    '</span>';
  }).join('');
}

// remove chip on click
attachPrev.addEventListener('click', function(e) {
  var rm = e.target.closest('.remove');
  if (!rm) return;
  var i = parseInt(rm.dataset.idx);
  pendingFiles.splice(i, 1);
  renderChips();
});

// ======== upload ========
fileInput.addEventListener('change', function() {
  var files = Array.from(fileInput.files);
  files.forEach(uploadOne);
  fileInput.value = '';
});

function uploadOne(file) {
  var idx = pendingFiles.length;
  pendingFiles.push({ file: file, name: file.name, status: 'uploading' });
  renderChips();

  var fd = new FormData();
  fd.append('file', file);

  return fetch('/api/v1/upload', { method:'POST', body:fd })
    .then(function(res){ return res.json().then(function(data){ return {ok:res.ok, data:data}; }); })
    .then(function(r){
      if (r.ok) {
        pendingFiles[idx].status = 'done';
        pendingFiles[idx].chunks = r.data.chunks;
        toast(file.name + ' ' + r.data.message, 'success');
      } else {
        throw new Error(r.data.detail || '上传失败');
      }
    })
    .catch(function(err){
      pendingFiles[idx].status = 'error';
      toast(file.name + ' 上传失败', 'error');
    })
    .finally(function(){ renderChips(); });
}

// ======== send ========
function send() {
  var text = textInput.value.trim();
  if (!text || btnSend.disabled) return;

  hideWelcome();

  // 先上传待处理的文件
  var uploading = pendingFiles.filter(function(f){ return f.file && f.status !== 'done' && f.status !== 'error'; });
  var uploadPromise = Promise.all(uploading.map(function(f){ return uploadOne(f.file); }));

  uploadPromise.then(function(){
    addUserMsg(text);
    textInput.value = '';
    textInput.style.height = 'auto';

    btnSend.disabled = true;
    var loading = addLoading();

    return fetch('/api/v1/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text, top_k: 3 })
    }).then(function(res){ return res.json().then(function(data){ return {ok:res.ok, data:data}; }); })
    .then(function(r){
      loading.remove();
      if (r.ok) {
        var html = fmtAnswer(r.data.answer);
        if (r.data.references && r.data.references.length > 0) {
          html += '<div class="refs">';
          r.data.references.forEach(function(ref){
            html += '<span class="ref-tag">📎 ' + esc(ref.source) +
              '<span class="score">p.' + ref.page + ' · ' + (ref.score != null ? ref.score.toFixed(3) : '0') + '</span></span>';
          });
          html += '</div>';
        }
        addAiMsg(html);
      } else {
        addSysMsg('请求失败: ' + (r.data.detail || '未知错误'));
      }
    }).catch(function(err){
      loading.remove();
      addSysMsg('网络错误: ' + err.message);
    }).finally(function(){
      btnSend.disabled = false;
      textInput.focus();
    });
  });
}

btnSend.addEventListener('click', send);

// ======== drag & drop ========
document.addEventListener('dragover', function(e){ e.preventDefault(); });
document.addEventListener('drop', function(e){
  e.preventDefault();
  var allowed = ['pdf','txt','md'];
  var files = Array.from(e.dataTransfer.files).filter(function(f){
    var ext = f.name.split('.').pop().toLowerCase();
    return allowed.indexOf(ext) !== -1;
  });
  files.forEach(uploadOne);
});
</script>
</body>
</html>
