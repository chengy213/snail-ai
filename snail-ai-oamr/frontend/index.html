<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snail AI Chat</title>
<style>
  :root {
    --bg: #1a1a2e;
    --sidebar-bg: #16213e;
    --card-bg: #0f3460;
    --text: #e4e4e4;
    --accent: #00d2ff;
    --user-bubble: #1b4332;
    --input-bg: #16213e;
    --border: #2a2a4a;
    --danger: #e94560;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ========== Header ========== */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--sidebar-bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    background: linear-gradient(135deg, var(--accent), #7b2ff7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header .actions { display: flex; gap: 8px; }
  header button {
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: background .2s;
  }
  header button:hover { background: #1a4a7a; }

  /* ========== Chat area ========== */
  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  /* Welcome */
  .welcome {
    text-align: center;
    margin-top: 12vh;
    opacity: 0.6;
  }
  .welcome .logo {
    font-size: 56px;
    margin-bottom: 10px;
  }
  .welcome h2 { font-size: 22px; margin-bottom: 6px; }
  .welcome p { font-size: 14px; color: #888; }

  /* message bubble */
  .msg-row {
    display: flex;
    gap: 10px;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    animation: fadeIn .25s ease;
  }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.assistant { justify-content: flex-start; }

  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    background: var(--card-bg);
  }
  .msg-row.user .avatar { order: 2; background: var(--accent); }

  .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.65;
    font-size: 15px;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .msg-row.user .bubble {
    background: var(--user-bubble);
    border-bottom-right-radius: 4px;
  }
  .msg-row.assistant .bubble {
    background: var(--card-bg);
    border-bottom-left-radius: 4px;
  }

  /* typing cursor */
  .cursor {
    display: inline-block;
    width: 8px; height: 16px;
    background: var(--accent);
    margin-left: 1px;
    vertical-align: text-bottom;
    animation: blink 0.6s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ========== Input area ========== */
  .input-area {
    padding: 12px 20px 18px;
    flex-shrink: 0;
  }
  .input-wrapper {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px 8px 8px 16px;
    transition: border-color .2s;
  }
  .input-wrapper:focus-within { border-color: var(--accent); }

  .input-wrapper textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    resize: none;
    min-height: 26px;
    max-height: 160px;
    line-height: 1.5;
    align-self: center;
  }
  .input-wrapper textarea::placeholder { color: #666; }

  .input-wrapper button {
    background: var(--accent);
    border: none;
    color: #000;
    font-weight: 600;
    padding: 0 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    white-space: nowrap;
    transition: opacity .2s;
  }
  .input-wrapper button:disabled { opacity: 0.4; cursor: not-allowed; }
  .input-wrapper button:hover:not(:disabled) { opacity: 0.85; }

  .stop-btn { background: var(--danger) !important; color: #fff !important; }

  /* ========== Code blocks ========== */
  .bubble code {
    background: rgba(0,0,0,.3);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
  }
  .bubble pre {
    background: #0d1117;
    border-radius: 8px;
    padding: 12px 16px;
    overflow-x: auto;
    margin: 8px 0;
    font-size: 13px;
    line-height: 1.5;
  }
  .bubble pre code { background: none; padding: 0; }

  /* scrollbar */
  .chat-container::-webkit-scrollbar { width: 6px; }
  .chat-container::-webkit-scrollbar-track { background: transparent; }
  .chat-container::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>Snail AI Chat</h1>
  <div class="actions">
    <button onclick="newChat()">+ 新对话</button>
  </div>
</header>

<div class="chat-container" id="chatContainer">
  <div class="welcome" id="welcomeBlock">
    <div class="logo">🐌</div>
    <h2>你好，我是 Snail AI</h2>
    <p>基于 DeepSeek 的智能聊天助手，支持流式输出</p>
  </div>
</div>

<div class="input-area">
  <div class="input-wrapper">
    <textarea id="userInput"
      placeholder="输入消息，Enter 发送，Shift+Enter 换行"
      rows="1"
      onkeydown="handleKeyDown(event)"
      oninput="autoResize(this)"></textarea>
    <button id="sendBtn" onclick="sendMessage()">发送</button>
  </div>
</div>

<script>
// ==================== 配置 ====================
const API_URL = '/chat';  // 同源访问，不再硬编码端口

// ==================== DOM ====================
const chatContainer = document.getElementById('chatContainer');
const userInput      = document.getElementById('userInput');
const sendBtn        = document.getElementById('sendBtn');
const welcomeBlock   = document.getElementById('welcomeBlock');

let isStreaming = false;
let abortCtrl   = null;

// ==================== 自动调整输入框高度 ====================
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

// ==================== 键盘处理 ====================
function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// ==================== 发送消息 ====================
async function sendMessage() {
  const text = userInput.value.trim();
  if (!text || isStreaming) return;

  // 隐藏欢迎语
  if (welcomeBlock) welcomeBlock.style.display = 'none';

  // 渲染用户消息
  appendMessage('user', text);
  userInput.value = '';
  autoResize(userInput);

  // 创建 AI 消息占位
  const { row, bubble } = appendMessage('assistant', '');
  scrollToBottom();

  // 切换到停止按钮
  setStreaming(true);

  // 发起流式请求
  abortCtrl = new AbortController();
  try {
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
      signal: abortCtrl.signal,
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    // ====== 流式读取 ======
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';  // 累积数据

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });

      // 解析 SSE 行
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';  // 最后一段可能不完整，留到下次

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const chunk = line.slice(6);  // 去掉 "data: "

        if (chunk === '[DONE]') {
          removeCursor(bubble);
          break;
        }

        bubble.textContent += chunk;
        scrollToBottom();
      }
    }

    // 兜底：如果后端没发 [DONE]
    removeCursor(bubble);
    if (!bubble.textContent) bubble.textContent = '(空响应)';

  } catch (err) {
    if (err.name === 'AbortError') {
      bubble.textContent += '\n\n[已停止生成]';
    } else {
      bubble.textContent += `\n\n[请求失败: ${err.message}]`;
    }
    removeCursor(bubble);
  } finally {
    setStreaming(false);
    abortCtrl = null;
  }
}

// ==================== 停止生成 ====================
function stopStreaming() {
  if (abortCtrl) abortCtrl.abort();
}

// ==================== 添加消息气泡 ====================
function appendMessage(role, text) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '👤' : '🐌';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  // 光标元素（仅 assistant 需要）
  if (role === 'assistant') {
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    cursor.id = 'typingCursor';
    bubble.appendChild(cursor);
  }

  row.appendChild(avatar);
  row.appendChild(bubble);
  chatContainer.appendChild(row);

  return { row, bubble };
}

// ==================== 移除光标 ====================
function removeCursor(bubble) {
  const cursor = bubble.querySelector('.cursor');
  if (cursor) cursor.remove();
}

// ==================== 切换按钮状态 ====================
function setStreaming(streaming) {
  isStreaming = streaming;
  if (streaming) {
    sendBtn.textContent = '停止';
    sendBtn.className  = 'stop-btn';
    sendBtn.onclick    = stopStreaming;
    userInput.disabled = true;
  } else {
    sendBtn.textContent = '发送';
    sendBtn.className  = '';
    sendBtn.onclick    = sendMessage;
    userInput.disabled = false;
  }
}

// ==================== 滚动到底部 ====================
function scrollToBottom() {
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

// ==================== 新对话 ====================
function newChat() {
  // 清空所有消息
  chatContainer.querySelectorAll('.msg-row').forEach(el => el.remove());
  if (welcomeBlock) welcomeBlock.style.display = '';
  userInput.focus();
}
</script>

</body>
</html>
